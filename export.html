    <style>
      :root{
        color-scheme:dark;
        /* 黒檀（エボニー）: ほぼ黒に近い焦げ茶の木地に、真鍮と漆の朱を差す。
           黒檀は素材自体が暗色のため、ライト/ダークを問わずこの一色で通す */
        --bg:#100d0a; --bg2:#171310; --bg3:#1d1813; --panel:#141110; --panel2:#26201a;
        --line:#5d4c2f; --line2:#3a3122;
        --tx:#f0e7d2; --tx2:#c3b28c; --tx3:#9a8560;

           ボトルグリーンのスモーク、箔の真鍮に寄せる（書き出し等の
           インライン指定 var(--teal)/var(--acc) もこの色で落ち着く） */

        --lane:#0f0803; --lane-alt:#140c05; --grid:#2e2010; --gridbar:#4d3519;
        --clip-inst:#55651f; --ruler:#1e130a;
        --shadow:0 10px 30px rgba(0,0,0,.62);
        --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
        --serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP",serif;

      button{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:6px;
        padding:4px 10px;cursor:pointer;min-height:32px}
      button:hover{border-color:var(--tx3)}
      button.on{background:var(--acc);border-color:var(--acc);color:#fff}
      button.ghost{background:transparent}
      button:disabled{opacity:.45;cursor:default}
      select,input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--bg2);
        border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-height:32px}
      input[type=number]{width:76px;font-family:var(--mono)}
      input[type=range]{accent-color:var(--acc);min-height:24px}
      label{color:var(--tx2)}
      .app{display:flex;flex-direction:column}

      /* ---------- transport ---------- */
      .transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
        padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);
        position:sticky;top:0;z-index:40}
      .transport .grp{display:flex;align-items:center;gap:6px}
      .tbtn{width:44px;height:40px;font-size:16px;display:grid;place-items:center;border-radius:8px}
      .tbtn.play{background:var(--acc);border-color:var(--acc);color:#fff;width:52px}
      .tbtn.play.playing{background:var(--teal);border-color:var(--teal)}
      .timebox{font-family:var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;
        padding:5px 12px;min-width:196px;text-align:center}
      .timebox .big{font-size:19px;letter-spacing:.04em}
      .timebox .sub{font-size:11px;color:var(--tx2)}
      .meterwrap{display:flex;align-items:flex-end;gap:3px;height:34px}
      .meter{width:9px;height:34px;background:var(--bg);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
      .meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--teal) 55%,var(--gold) 78%,var(--acc) 95%);display:block}
      .spacer{flex:1}
      .small{font-size:11px;color:var(--tx2)}
      .kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--tx2)}

      /* ---------- toolbar ---------- */
      .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;background:var(--bg3);border-bottom:1px solid var(--line2)}
      .toolbar .sep{width:1px;height:24px;background:var(--line)}
      .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
      .seg button{border:0;border-radius:0;background:transparent}
      .seg button.on{background:var(--blue);color:#fff}

      /* ---------- timeline ---------- */
      .tlwrap{overflow-x:auto;position:relative;background:var(--lane);border-bottom:1px solid var(--line)}
      .tlgrid{display:grid;grid-template-columns:208px 1fr}
      .heads{position:sticky;left:0;z-index:6;background:var(--bg2)}
      .head-spacer{height:30px;border-bottom:1px solid var(--line);background:var(--ruler);position:sticky;top:0;z-index:7;
        display:flex;align-items:center;padding:0 10px;color:var(--tx2);font-size:11px;gap:6px}
      .thead{height:96px;border-bottom:1px solid var(--line2);padding:8px 10px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
      .thead.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
      .thead .nm{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden}
      .dot{width:11px;height:11px;border-radius:3px;flex:none}
      .badge{font-size:10px;color:#fff;border-radius:4px;padding:1px 6px;font-weight:600}
      .thead .row{display:flex;align-items:center;gap:6px}
      .msbtn{width:30px;min-height:26px;height:26px;padding:0;font-size:11px;font-weight:700;border-radius:5px;flex:none}
      .msbtn.m.on{background:var(--gold);border-color:var(--gold);color:#231a00}
      .msbtn.s.on{background:var(--teal);border-color:var(--teal);color:#04231d}
      .thead input[type=range]{flex:1;min-width:0}
      .thead .del{margin-left:auto;width:28px;min-height:26px;height:26px;padding:0;color:var(--tx3);flex:none}
      .lanes{position:relative}
      .ruler{position:sticky;top:0;z-index:5;display:block;background:var(--ruler);border-bottom:1px solid var(--line);cursor:text}
      .lane{height:96px;border-bottom:1px solid var(--line2);position:relative}
      .lane.sel{background:rgba(127,140,180,.06)}
      .lane.drop{outline:2px dashed var(--blue);outline-offset:-2px}
      .clip{position:absolute;top:8px;height:80px;border-radius:7px;overflow:hidden;cursor:grab;
        border:1px solid rgba(0,0,0,.35);box-shadow:0 2px 6px rgba(0,0,0,.3)}
      .clip.sel{outline:2px solid #fff;outline-offset:0;z-index:3}
      .clip canvas{display:block;width:100%;height:100%}
      .clip .cap{position:absolute;top:0;left:0;right:0;padding:2px 7px;font-size:10.5px;color:#fff;
        background:rgba(0,0,0,.34);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
      .clip .edge{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
      .clip .edge.l{left:0}.clip .edge.r{right:0}
      .playhead{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--acc);z-index:4;pointer-events:none}
      .playhead::before{content:"";position:absolute;top:0;left:-7px;border:6px solid transparent;border-top:8px solid var(--acc)}
      .autocanvas{position:absolute;inset:0;z-index:3;cursor:crosshair}
      .manual{max-width:760px;line-height:1.7;color:var(--tx2)}
      .manual h2{margin:0 0 10px;font-size:16px;color:var(--tx)}
      .manual h3{margin:18px 0 6px;font-size:13px;color:var(--tx)}
      .manual h3:first-of-type{margin-top:4px}
      .manual p{margin:6px 0}
      .manual ol,.manual ul{margin:6px 0;padding-left:22px}
      .manual li{margin:4px 0}
      .manual .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

      /* ---------- inspector ---------- */
      .insp{background:var(--panel);display:flex;flex-direction:column}
      .tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
      .tabs button{border:0;background:transparent;border-radius:8px 8px 0 0;padding:7px 14px;color:var(--tx2);min-height:36px}
      .tabs button.on{background:var(--bg2);color:var(--tx);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}
      .tabbody{padding:12px 14px 20px}
      .cols{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
      .sect{min-width:200px}
      .sect h3{margin:0 0 10px;font-size:12px;color:var(--tx2);letter-spacing:.06em;font-weight:700}
      .fld{display:flex;align-items:center;gap:8px;margin-bottom:8px}
      .fld label{width:106px;flex:none;white-space:nowrap}
      .fld output{font-family:var(--mono);font-size:12px;min-width:64px;color:var(--tx)}
      .fld input[type=range]{width:130px}

      /* fx chain — 直列チェーンの各段は独立ユニット（ON/OFF・並び替え・段別プリセット・複製・たたむ） */
      .fxwrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
      .fxwrap button{min-height:38px}
      .chain{width:312px;max-width:100%;flex:none;display:flex;flex-direction:column;gap:8px}
      .fxitem{display:flex;gap:8px;background:var(--bg2);border:1px solid var(--line);
        border-radius:10px;padding:8px;cursor:pointer;align-items:flex-start}
      .fxitem.sel{border-color:var(--acc)}
      .fxitem.off{opacity:.55}
      .fxnum{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
        display:grid;place-items:center;font-family:var(--mono);font-size:12px;margin-top:2px}
      .fxitem.sel .fxnum,.fxhead .fxnum{background:var(--acc);border-color:var(--acc);color:#fff}
      .fxmeta{flex:1;min-width:0}
      .fxmeta .t{font-weight:700;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .fxsum{display:block;color:var(--tx2);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .fxacts{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
      .fxitem button{min-width:38px;padding:0 9px;font-size:12px}
      .fxpower{font-weight:700;min-width:54px;flex:none}
      .fxpower.on{background:var(--teal);border-color:var(--teal);color:#04231d}
      .fxeditor{flex:1;min-width:300px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:12px}
      .fxeditor h3{margin:0 0 10px;font-size:13px}
      .fxhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
      .fxhead .ttl{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
      .fxhead .acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
      .fxhead .acts button{padding:0 12px}
      .fxpresetbar{border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:9px 0;margin-bottom:12px}
      .fxpresetbar .cap{font-size:11px;color:var(--tx2);font-weight:700;letter-spacing:.04em}
      .fxchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
      .fxchips button{padding:5px 12px;font-size:12.5px}
      .fxchips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
      .fxchips .uchip{display:flex;gap:3px}
      .fxchips .uchip button[data-udel]{min-width:34px;padding:0 6px;color:var(--tx3)}
      .fxusersave{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
      .fxusersave input{flex:1;min-width:140px;min-height:38px}
      .fxeditor h3{margin:0 0 10px;font-size:13px}
      #eqCanvas{width:100%;height:190px;display:block;background:var(--bg);border:1px solid var(--line2);border-radius:8px;touch-action:none}
      table.params{border-collapse:collapse;width:100%}
      table.params th,table.params td{padding:3px 4px;text-align:left;font-size:12px}
      table.params th{color:var(--tx2);font-weight:600}
      table.params input[type=number]{width:70px}
      table.params select{min-height:30px;padding:2px 6px}
      .knobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px 16px;max-width:760px}
      .knob label{display:block;font-size:11px;color:var(--tx2);margin-bottom:2px}
      .knob .row{display:flex;align-items:center;gap:6px}
      .knob input[type=range]{flex:1;min-width:0}
      .knob output{font-family:var(--mono);font-size:11.5px;min-width:58px}
      .grmeter{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
      .grmeter i{display:block;height:100%;background:var(--acc2);width:0%}

      /* mixer */
      .mixer{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:6px}
      .strip{width:128px;flex:none;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:9px 8px;
        display:flex;flex-direction:column;align-items:center;gap:6px}
      .strip.sel{border-color:var(--acc)}
      .strip .nm{font-weight:600;font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;max-width:112px}
      .strip .vfader{writing-mode:vertical-lr;direction:rtl;width:26px;height:104px;accent-color:var(--acc)}
      .strip .mini{width:100%}
      .strip .mini label{font-size:10px;color:var(--tx2);display:flex;justify-content:space-between}
      .strip .mini input[type=range]{width:100%}
      .strip.ret{border-style:dashed}
      .strip .route{font-size:10.5px;color:var(--tx2);text-align:center;line-height:1.45;word-break:break-all}
      .strip select{width:100%;min-height:34px;font-size:12px}
      .strip .sumbtn{min-height:34px;font-size:11.5px;padding:0 8px}
      .strip.off{opacity:.55}
      /* stage3: clip units + mix preset bar */
      .clipchain{display:flex;flex-direction:column;gap:8px;min-width:280px;max-width:420px;flex:1}
      .clipitem{display:flex;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;align-items:flex-start}
      .clipitem.sel{border-color:var(--acc)}
      .clipitem.off{opacity:.55}
      .clipitem button{min-height:38px;min-width:38px;padding:0 9px;font-size:12px}
      .mixbar{border:1px solid var(--line2);border-radius:10px;background:var(--bg2);padding:10px 12px;margin-bottom:12px}
      .mixbar .cap{font-size:11px;color:var(--tx2);font-weight:700;letter-spacing:.04em}
      .mixbar .fxchips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
      .clip.muted{opacity:.45;filter:grayscale(.5)}
      .dropveil{position:fixed;inset:0;background:rgba(26,16,6,.55);z-index:50;display:none;place-items:center;
        color:#fff;font-size:20px;font-weight:700;border:4px dashed var(--blue)}
      .dropveil.show{display:grid}
      /* ---------- bottom fixed transport ---------- */
      body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
      .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:55;
        display:flex;align-items:center;justify-content:center;gap:10px;
        padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
        background:var(--bg2);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.28)}
      .bottombar .tbtn{flex:none}
      .bar-time{font-family:var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;
        padding:4px 12px;min-width:172px;text-align:center;line-height:1.3}
      .bar-time .big{font-size:17px;letter-spacing:.04em}
      .bar-time .sub{font-size:11px;color:var(--tx2)}
      @media (max-width:760px){
        .bar-time{min-width:138px;padding:4px 8px}
        .bar-time .big{font-size:15px}
        .bottombar{gap:7px;padding-left:8px;padding-right:8px}
      }
      .toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bg3);color:var(--tx);
        border:1px solid var(--line);border-radius:9px;padding:9px 16px;box-shadow:var(--shadow);z-index:60;display:none;max-width:88vw;pointer-events:none}
      .confirmveil{position:fixed;inset:0;background:rgba(12,8,4,.62);z-index:70;display:grid;place-items:center;padding:16px}
      .confirmveil[hidden]{display:none}
      .confirmbox{max-width:480px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
      .confirmbox h2{margin:0 0 8px;font-size:16px}
      .confirmbox p{margin:6px 0;color:var(--tx2);line-height:1.65}
      .confirmbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
      /* pitch editor */
      .pitchwrap{max-width:1020px}
      .pitchwrap h3{margin:0 0 8px;font-size:13px}
      .pitchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
      #pitchCanvas{width:100%;height:280px;display:block;background:var(--bg);border:1px solid var(--line2);border-radius:8px;touch-action:none}
      .pitchinfo{font-family:var(--mono);font-size:12px;color:var(--tx)}
      /* non-destructive pitch layer */
      .layerstack{display:flex;flex-direction:column;gap:0;margin:0 0 12px;max-width:1020px}
      .layercard{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line2);padding:10px 12px}
      .layercard:first-child{border-radius:10px 10px 0 0}
      .layercard:last-child{border-radius:0 0 10px 10px}
      .layercard + .layercard{border-top:0}
      .layercard.src{opacity:.92}
      .layercard.active{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
      .layercard.off{opacity:.62}
      .layer-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:16px}
      .layer-main{flex:1;min-width:0}
      .layer-main b{font-size:13px}
      .layer-main p{margin:3px 0 0;color:var(--tx2);font-size:12px;line-height:1.55}
      .layer-arrow{align-self:center;color:var(--tx3);font-size:14px;line-height:1;padding:2px 0 2px 22px}
      .strengthrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
      .strengthrow input[type=range]{width:180px}
      .presetchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
      .presetchips button{font-size:12px;padding:4px 10px}
      .presetchips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
      .pitch-details{margin-top:10px;border:1px solid var(--line2);border-radius:8px;background:var(--bg2);padding:0 12px}
      .pitch-details summary{cursor:pointer;padding:9px 0;font-weight:600;color:var(--tx2)}
      .pitch-details p,.pitch-details li{color:var(--tx2);line-height:1.65}
      .pitch-details ul{margin:6px 0 10px;padding-left:20px}
      .clipbadge{position:absolute;right:6px;bottom:5px;font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 7px;pointer-events:none}
      @media (max-width:760px){
        .tlgrid{grid-template-columns:132px 1fr}
        .chain{width:100%}
        .fxeditor{min-width:0;width:100%}
        .fxhead .acts{margin-left:0}
        .thead{height:84px;padding:6px}
        .lane{height:84px}
        .clip{height:68px}
        .timebox{min-width:150px}
        .thead .volVal{display:none}
        .thead .panVal{display:none}
        .toast{bottom:auto;top:70px}
      }

      /* ---------- ヴィンテージ・スモーキー × 黒檀テーマ ----------
         参考にした作法（商標・ロゴは持ち込まない）:
         - ワイン／ウイスキーのラベル: 二重罫の細いフレーム、明朝の字間、
           箔押しの真鍮、澱のようなオックスブラッドとボトルグリーン
         - 革とラッカーの小物: 角は丸めず小さく（2〜3px）、面はマットな
           スモークガラス／黒ラッカー、上端にだけ細い光
         - 金具: スライダーのつまみと主要ボタンは真鍮の丸金具として作る
         原色のベタ塗り（赤・青・ティール）は全廃し、状態の区別は
         真鍮・オックスブラッド・ボトルグリーンの3色に集約する。 */
      :root{
        --brass:#c9a86a; --brass-dim:#8a744c; --brass-dark:#5d4c2f;
        --champagne:#ece1c6;
        --lacquer:linear-gradient(180deg,#35302a 0%,#221e1a 48%,#171412 100%);
        --lacquer-hi:linear-gradient(180deg,#443c33 0%,#2a2521 48%,#1d1916 100%);
        --oxblood:linear-gradient(180deg,#6e2b31 0%,#471a1f 55%,#341216 100%);
        --bottle:linear-gradient(180deg,#33544a 0%,#223c34 55%,#182b25 100%);
        --goldfoil:linear-gradient(180deg,#dcc084 0%,#b69655 55%,#93753d 100%);
      }
      /* 地: 黒檀の実写にグレーの煙のベールを重ね、赤みを落としてスモーキーに */
      body{background-image:var(--grain);background-size:auto,500px 680px}
      .insp{background-image:var(--grain);background-size:auto,500px 680px}
      .transport,.toolbar,.bottombar,.heads,.toast,.confirmbox{background-image:var(--grain);background-size:auto,cover;background-position:center,center}
      .fxitem,.clipitem,.strip,.layercard,.mixbar,.fxeditor,.thead.sel{background-image:var(--grain-soft);background-size:auto,cover;background-position:center,center}
      /* 天板と底板: 真鍮の二重ヘアラインで締める */
      .transport{border-bottom:1px solid var(--brass-dark);box-shadow:0 1px 0 rgba(0,0,0,.85),inset 0 1px 0 rgba(236,225,198,.10),inset 0 -3px 0 -1px rgba(201,168,106,.22),inset 0 -18px 24px -20px rgba(0,0,0,.9)}
      .bottombar{border-top:1px solid var(--brass-dark);box-shadow:0 -8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(236,225,198,.10),inset 0 3px 0 -1px rgba(201,168,106,.22)}
      .toolbar{border-bottom:1px solid #2c251b;box-shadow:inset 0 -10px 18px -14px rgba(0,0,0,.8)}
      .toolbar .sep{background:linear-gradient(180deg,transparent,var(--brass-dark),transparent)}
      .tlwrap{background:#0b0a09}
      .ruler,.head-spacer{background:#16130f}

      /* ===== ボタン: 黒ラッカーに真鍮の縁、上端にだけ細い光 ===== */
      button{
        background:var(--lacquer);background-image:var(--lacquer);
        border:1px solid var(--brass-dark);border-radius:3px;
        color:var(--champagne);letter-spacing:.07em;font-weight:500;
        padding:6px 14px;min-height:36px;text-shadow:0 1px 2px rgba(0,0,0,.65);
        box-shadow:inset 0 1px 0 rgba(236,225,198,.15),inset 0 -8px 14px -10px rgba(0,0,0,.9),inset 0 0 0 1px rgba(0,0,0,.35),0 2px 5px rgba(0,0,0,.45);
        transition:border-color .15s ease,background-color .15s ease,color .15s ease;
      }
      button:hover{border-color:var(--brass);color:#fff6e0;background-image:var(--lacquer-hi)}
      button:active{transform:translateY(1px);box-shadow:inset 0 2px 8px rgba(0,0,0,.75),inset 0 0 0 1px rgba(0,0,0,.4)}
      /* ON状態: ワインの澱色ラッカー＋真鍮の内枠（ベタ塗りの赤は使わない） */
      button.on{
        background:var(--oxblood);background-image:var(--oxblood);
        border-color:var(--brass);color:#f6ead0;
        box-shadow:inset 0 0 0 1px rgba(201,168,106,.38),inset 0 1px 0 rgba(255,235,200,.18),inset 0 -8px 14px -10px rgba(0,0,0,.85),0 2px 5px rgba(0,0,0,.45);
      }
      button.on:hover{border-color:#e2c98d}
      button.ghost{background:transparent;background-image:none;border-color:rgba(138,116,76,.55);box-shadow:none;color:#cdbd97;text-shadow:none}
      button.ghost:hover{border-color:var(--brass);color:#fff6e0;background-image:none}
      button:disabled{opacity:.42;filter:grayscale(.5);transform:none}
      /* 主要アクション（書き出し／確定）は箔押しの金ラベルにする。
         インライン指定（ティール／赤ベタ）より優先させる */
      #btnExportGo,#btnDoExport,#btnDemoOk{
        background:var(--goldfoil)!important;background-image:var(--goldfoil)!important;
        border:1px solid #e8d096!important;color:#241a0c!important;
        font-family:var(--serif);font-weight:700;letter-spacing:.14em;text-shadow:0 1px 0 rgba(255,246,220,.45);
        box-shadow:inset 0 0 0 1px rgba(90,70,32,.55),inset 0 1px 0 rgba(255,248,225,.65),0 2px 6px rgba(0,0,0,.5);
      }
      #btnExportGo:hover,#btnDoExport:hover,#btnDemoOk:hover{border-color:#f4e3ae!important;color:#191104!important}

      /* ===== トランスポート: 再生は封蝋のような丸いオックスブラッドのシール ===== */
      .tbtn{width:46px;height:44px;border-radius:3px;font-size:15px}
      .tbtn.play{
        width:48px;height:48px;border-radius:50%;
        background:radial-gradient(circle at 35% 28%,#7d353c 0%,#4a1d22 58%,#2f1216 100%);background-image:radial-gradient(circle at 35% 28%,#7d353c 0%,#4a1d22 58%,#2f1216 100%);
        border:1px solid var(--brass);color:#f3e5c3;
        box-shadow:0 0 0 3px #12100e,0 0 0 4px rgba(201,168,106,.55),inset 0 1px 0 rgba(255,235,200,.28),inset 0 -6px 12px -6px rgba(0,0,0,.8),0 3px 8px rgba(0,0,0,.55);
      }
      .tbtn.play:hover{border-color:#e2c98d;color:#fff6e0}
      .tbtn.play.playing{
        background:radial-gradient(circle at 35% 28%,#3e6a5b 0%,#24443a 58%,#16281f 100%);background-image:radial-gradient(circle at 35% 28%,#3e6a5b 0%,#24443a 58%,#16281f 100%);
        border-color:var(--brass);
      }
      .bottombar .tbtn.play{width:46px;height:46px}

      /* ===== セグメント（オートメーション切替）: 黒ラッカーの枠に金の選択片 ===== */
      .seg{background:#0d0c0b;border:1px solid var(--brass-dark);border-radius:3px;padding:2px;gap:2px;box-shadow:inset 0 2px 7px rgba(0,0,0,.7)}
      .seg button{border:1px solid transparent;border-radius:2px;background:transparent;background-image:none;box-shadow:none;color:#b3a37f;min-height:32px;text-shadow:none}
      .seg button:hover{color:#fff6e0;border-color:transparent}
      .seg button.on{background:var(--goldfoil);background-image:var(--goldfoil);border-color:#e8d096;color:#221809;font-weight:700;text-shadow:0 1px 0 rgba(255,246,220,.4);box-shadow:inset 0 0 0 1px rgba(90,70,32,.5)}

      /* ===== タブ: 明朝＋字間、金の下罫だけを引く ===== */
      .tabs{border-bottom:1px solid var(--brass-dark);box-shadow:inset 0 -1px 0 rgba(0,0,0,.5)}
      .tabs button{
        font-family:var(--serif);letter-spacing:.1em;font-size:13px;color:#a9966d;
        background:transparent;background-image:none;border:0;border-radius:0;box-shadow:none;text-shadow:none;min-height:38px;
      }
      .tabs button:hover{color:#e9dcba;border-color:transparent}
      .tabs button.on{
        color:var(--champagne);font-weight:700;
        background:linear-gradient(180deg,rgba(201,168,106,.12),rgba(201,168,106,0));background-image:linear-gradient(180deg,rgba(201,168,106,.12),rgba(201,168,106,0));
        box-shadow:inset 0 -2px 0 var(--brass);
      }

      /* ===== 小さな金具類: M/S、電源、番号 ===== */
      .msbtn{border-radius:2px;font-family:var(--mono);letter-spacing:.04em}
      .msbtn.m.on{background:var(--goldfoil);background-image:var(--goldfoil);border-color:#e8d096;color:#221809;text-shadow:none;box-shadow:inset 0 0 0 1px rgba(90,70,32,.5)}
      .msbtn.s.on{background:#3d5a50;background-image:linear-gradient(180deg,#44655a,#2c443b);border-color:var(--brass);color:#eef2e4;text-shadow:none}
      .fxpower{letter-spacing:.12em;font-family:var(--mono);font-size:12px}
      .fxpower.on{background:var(--bottle);background-image:var(--bottle);border-color:var(--brass);color:#f0ead2;box-shadow:inset 0 0 0 1px rgba(201,168,106,.35),inset 0 1px 0 rgba(255,235,200,.15)}
      .fxnum{background:#0f0e0c;border:1px solid var(--brass-dark);color:var(--brass);font-family:var(--serif)}
      .fxitem.sel .fxnum,.fxhead .fxnum{background:var(--oxblood);background-image:var(--oxblood);border-color:var(--brass);color:#f6ead0}
      .fxitem.sel,.clipitem.sel,.strip.sel{border-color:var(--brass)}
      .thead.sel{box-shadow:inset 3px 0 0 var(--brass)}
      .layercard.active{border-color:var(--brass-dark);box-shadow:inset 3px 0 0 var(--brass)}
      .badge{border-radius:2px;letter-spacing:.06em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.14)}
      .dot{border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.35)}
      .kbd{background:#0d0c0b;border-color:var(--brass-dark);border-radius:2px;color:#bfae8a;box-shadow:inset 0 -2px 0 rgba(0,0,0,.6)}

      /* ===== プリセット等のチップ: ラベルの札のように薄く、選択は澱色 ===== */
      .fxchips button,.presetchips button{
        border-radius:2px;background:rgba(13,12,11,.55);background-image:none;
        border-color:rgba(138,116,76,.6);font-size:12px;letter-spacing:.05em;box-shadow:inset 0 1px 0 rgba(236,225,198,.07);
      }
      .fxchips button.on,.presetchips button.on,.mixbar .fxchips button.on{
        background:var(--oxblood);background-image:var(--oxblood);border-color:var(--brass);color:#f6ead0;
        box-shadow:inset 0 0 0 1px rgba(201,168,106,.35),inset 0 1px 0 rgba(255,235,200,.15);
      }

      /* ===== 入力欄: スモークガラスに沈めた真鍮枠 ===== */
      select,input[type=text],input[type=number]{
        background:#141210;background-image:linear-gradient(180deg,rgba(0,0,0,.28),rgba(236,225,198,.02));
        border:1px solid var(--brass-dark);border-radius:3px;color:var(--champagne);letter-spacing:.04em;
        box-shadow:inset 0 2px 6px rgba(0,0,0,.55),inset 0 1px 0 rgba(236,225,198,.05);
      }
      select:hover,input[type=text]:hover,input[type=number]:hover{border-color:var(--brass-dim)}
      /* ===== スライダー: 細い真鍮のレールと丸金具のつまみ ===== */
      input[type=range]{accent-color:var(--brass);-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
      input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(90deg,var(--brass-dim),#3d3425);box-shadow:0 1px 0 rgba(0,0,0,.65)}
      input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecd69c 0%,#a8874c 62%,#77603a 100%);border:1px solid #0d0b09;box-shadow:0 0 0 1px rgba(201,168,106,.55),0 2px 5px rgba(0,0,0,.6)}
      input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:linear-gradient(90deg,var(--brass-dim),#3d3425)}
      input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecd69c 0%,#a8874c 62%,#77603a 100%);border:1px solid #0d0b09;box-shadow:0 0 0 1px rgba(201,168,106,.55),0 2px 5px rgba(0,0,0,.6)}
      .strip .vfader{accent-color:var(--brass)}

      /* ===== カード／パネル: ラベルの二重罫フレーム ===== */
      .fxitem,.clipitem,.strip,.layercard,.mixbar,.fxeditor,.confirmbox{
        border:1px solid #54452c;border-radius:4px;
        box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 0 0 3px rgba(201,168,106,.06),inset 0 1px 0 rgba(236,225,198,.08),0 4px 14px rgba(0,0,0,.35);
      }
      .layer-ico{background:#0f0e0c;border:1px solid var(--brass-dark);border-radius:3px;color:var(--brass)}
      .pitch-details{border-color:#3a3122;border-radius:4px}
      #eqCanvas,#pitchCanvas{background:#100e0c;border:1px solid #3a3122;border-radius:4px}
      .grmeter,.meter{border-color:var(--brass-dark);border-radius:2px;background:#0c0b0a}
      .meter i{background:linear-gradient(to top,#4d7a68 55%,#c9a86a 80%,#8c3a34 96%)}
      .clip{border-radius:3px;border-color:rgba(201,168,106,.35)}
      .clip.sel{outline:2px solid var(--brass)}
      .playhead{border-left:2px solid #d9be82}
      .playhead::before{border-top-color:#d9be82}
      .toast{border:1px solid var(--brass-dark);border-radius:3px;letter-spacing:.05em;box-shadow:inset 0 1px 0 rgba(236,225,198,.12),0 10px 30px rgba(0,0,0,.62)}
      .dropveil{border-color:var(--brass);background:rgba(10,9,8,.72);font-family:var(--serif);letter-spacing:.12em}

      :focus-visible{outline:2px solid rgba(201,168,106,.65);outline-offset:1px}
      /* 見出しとラベルは明朝＋字間で締める */
      .sect h3,.fxeditor h3,.manual h2,.manual h3,.confirmbox h2,.pitchwrap h3{font-family:var(--serif);letter-spacing:.1em;color:var(--brass)}
      .manual h2,.confirmbox h2{color:var(--champagne)}
      .transport label,.toolbar label{font-family:var(--serif);letter-spacing:.12em;color:#b7a67f}
      .fxpresetbar .cap,.mixbar .cap{font-family:var(--serif);letter-spacing:.1em;color:var(--brass)}
      /* 時刻表示: スモークガラスに真鍮の二重枠を嵌めた銘板 */
      .timebox,.bar-time{
        background:radial-gradient(ellipse at 50% 0%,#26221d 0%,#0d0c0b 72%);background-color:#0d0c0b;
        border:1px solid var(--brass-dim);border-radius:3px;
        box-shadow:inset 0 0 0 1px #000,inset 0 0 0 3px rgba(201,168,106,.09),inset 0 3px 14px rgba(0,0,0,.85);
      }
      .timebox .big,.bar-time .big{color:#e6cf92;text-shadow:0 0 12px rgba(230,207,146,.28)}
      .timebox .sub,.bar-time .sub{color:#b3a37f}
      ::selection{background:rgba(160,128,70,.55);color:#fff8ea}
      ::-webkit-scrollbar{width:10px;height:10px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:#4a3d28;border-radius:2px;border:2px solid var(--bg)}
      ::-webkit-scrollbar-thumb:hover{background:var(--brass-dim)}
      @media (prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}

      /* ---------- ワインサイトの作法への再構成 ----------
         手本: Dribbble の wine-website に通じるワイン／ワイナリー系の作法。
         1. 見出しは明朝のディスプレイ書体で大きく、ラベルは字間の広い小 caps
         2. 余白を贅沢に取り、要素を詰め込まない
         3. 罫は細い金のヘアライン、パネルはラベルの中央寄せ・対称の構図
         4. 地は深いバーガンディ〜黒檀の闇、文字はクリーム単色、
            金は箔の差し色に限定して多用しない
         5. 黒檀の実写はラベルの地として静かに敷き、UI は影で浮かせる
         コントラストは全体に抑えめ。文字は単色のみで、
         グラデーション文字や色の重ね掛け、光彩は使わない。 */
      :root{
        --bg:#130a0c; --bg2:#1a1013; --bg3:#211419; --panel:#170e11; --panel2:#2b1d20;
        --line:rgba(198,166,100,.32); --line2:rgba(198,166,100,.15);
        --tx:#efe6d0; --tx2:#c6bba4; --tx3:#9c8e74;
        --gold:#c6a664; --brass:#bfa26a; --brass-dim:#94815e; --brass-dark:rgba(198,166,100,.32);

          linear-gradient(180deg, rgba(26,12,16,.87), rgba(15,8,11,.91)),

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script>
"use strict";
/* ============================================================
   歌ってみたMIX — Web Audio マルチトラックMIX
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const db2lin=db=>Math.pow(10,db/20), lin2db=l=>20*Math.log10(Math.max(l,1e-6));
const fmtT=s=>{s=Math.max(0,s);const m=Math.floor(s/60),ss=s-m*60;return m+":"+ss.toFixed(3).padStart(6,"0")};
const fmtDb=v=>(v<=-59.5?"-∞":(v>0?"+":"")+v.toFixed(1))+" dB";
let uid=1; const nid=()=>"id"+(uid++);

const TYPES={inst:{label:"オケ",color:"#7d8c4c",badge:"#5b6a38"},
             vocal:{label:"ボーカル",color:"#c05a4e",badge:"#8c3a34"},
             harmony:{label:"ハモリ",color:"#6d84a3",badge:"#4c6076"}};

/* ---------- state ---------- */
const S={
  ctx:null, master:null, masterComp:null, analyser:null,
  bpm:120, playing:false, playCtxStart:0, playPosStart:0, pos:0,
  tracks:[], buses:[], sources:[],
  selTrack:null, selClip:null, selFx:-1,
  loop:{on:false,start:0,end:8},
  autoMode:"off", snap:true, px:42,
  returns:null, demoLoaded:false, userFxPresets:{}, userMixPresets:[],
  revMuted:false, dlyMuted:false, selBus:null,
};

/* ============================================================
   エフェクト段モジュール（第2段リファクタ）
   ------------------------------------------------------------
   ノード化はしない。代わりに直列チェーンの各段を独立ユニットにする:
   - 段の種類ごとに 定義（初期値）/ プリセット / 要約 を FXDEF に登録する
   - 段は ON/OFF・並び替え・複製・初期値リセット・折りたたみ が独立に効く
   - プリセットは段の種類ごとに適用でき、ユーザープリセットは
     セッション内（メモリ）だけに保持する
   新しい段の種類を足すときは FXDEF に1エントリ追加すればよい。
   ============================================================ */
function delaySyncSec(sync,bpm){ const b=60/(bpm||120); return {"4":b,"d8":b*0.75,"8":b/2,"16":b/4,"t8":b/3}[sync]||null; }
const FXDEF={
  eq:{ name:"パラメトリックEQ",
    make(){ return {type:"eq",on:true,bands:[
      {t:"highpass",f:80,g:0,q:0.71,on:true},
      {t:"peaking",f:250,g:0,q:1.0,on:true},
      {t:"peaking",f:1000,g:0,q:1.0,on:true},
      {t:"peaking",f:3500,g:0,q:1.0,on:true},
      {t:"highshelf",f:9000,g:0,q:0.71,on:true}]}; },
    summary(fx){ const onN=fx.bands.filter(b=>b.on).length;
      const hp=fx.bands[0]&&fx.bands[0].on?("HPF "+Math.round(fx.bands[0].f)+"Hz ・ "):"";
      let pk=null; fx.bands.forEach(b=>{ if(b.on&&Math.abs(b.g)>0&&(!pk||Math.abs(b.g)>Math.abs(pk.g))) pk=b; });
      return hp+(pk?("最大 "+(pk.g>0?"+":"")+pk.g.toFixed(1)+"dB @ "+(pk.f>=1000?(pk.f/1000)+"k":Math.round(pk.f))+"Hz"):"フラット")+"（"+onN+"/5バンド）"; },
    presets:[
      {id:"flat",label:"フラット",apply(){}},
      {id:"vocal",label:"ボーカル基本",apply(f){ f.bands[0].f=90; f.bands[1].g=-1; f.bands[3].g=2.5; f.bands[4].g=1.5; }},
      {id:"lowcut",label:"ローカットのみ",apply(f){ f.bands[0].f=110; }},
      {id:"air",label:"抜け・エアー",apply(f){ f.bands[1].g=-2; f.bands[3].f=4000; f.bands[3].g=3; f.bands[4].g=4; }},
      {id:"demud",label:"こもり解消",apply(f){ f.bands[0].f=100; f.bands[1].g=-3.5; f.bands[1].q=1.4; f.bands[2].f=800; f.bands[2].g=1; f.bands[3].g=2; }},
    ]},
  comp:{ name:"コンプレッサー",
    make(){ return {type:"comp",on:true,threshold:-18,ratio:3,attack:0.01,release:0.25,knee:18,makeup:0}; },
    summary(fx){ return fx.threshold.toFixed(0)+"dB ・ "+fx.ratio.toFixed(1)+":1"+(fx.makeup>0?" ・ MU +"+fx.makeup.toFixed(1)+"dB":""); },
    presets:[
      {id:"std",label:"歌ってみた標準",apply(){}},
      {id:"light",label:"軽く整える",apply(f){ f.threshold=-14; f.ratio=2; f.attack=0.02; f.release=0.3; f.knee=24; }},
      {id:"strong",label:"しっかり潰す",apply(f){ f.threshold=-24; f.ratio=5; f.attack=0.005; f.release=0.18; f.knee=12; f.makeup=3; }},
      {id:"ballad",label:"バラード（ゆっくり）",apply(f){ f.threshold=-16; f.ratio=2.5; f.attack=0.03; f.release=0.4; f.knee=30; }},
    ]},
  reverb:{ name:"リバーブ",
    make(){ return {type:"reverb",on:true,decay:2.4,mix:0.3,predelay:0.02}; },
    summary(fx){ return fx.decay.toFixed(1)+"秒 ・ Mix "+Math.round(fx.mix*100)+"%"; },
    presets:[
      {id:"plate",label:"プレート（標準）",apply(){}},
      {id:"room",label:"小さな部屋",apply(f){ f.decay=0.9; f.predelay=0.005; f.mix=0.22; }},
      {id:"hall",label:"ホール",apply(f){ f.decay=4.2; f.predelay=0.04; f.mix=0.35; }},
      {id:"subtle",label:"うっすら",apply(f){ f.decay=1.8; f.predelay=0.01; f.mix=0.15; }},
    ]},
  delay:{ name:"ディレイ",
    make(){ return {type:"delay",on:true,time:0.375,feedback:0.35,mix:0.25,sync:"d8"}; },
    summary(fx){ const s={off:"","4":"4分同期","d8":"付点8分同期","8":"8分同期","16":"16分同期","t8":"8分三連同期"}[fx.sync]||"";
      return Math.round(fx.time*1000)+"ms ・ FB "+Math.round(fx.feedback*100)+"% ・ Mix "+Math.round(fx.mix*100)+"%"+(s?" ・ "+s:""); },
    presets:[
      {id:"dotted",label:"付点8分（BPM同期）",apply(f,bpm){ f.sync="d8"; f.time=delaySyncSec("d8",bpm); f.feedback=0.35; f.mix=0.25; }},
      {id:"eighth",label:"8分ディレイ",apply(f,bpm){ f.sync="8"; f.time=delaySyncSec("8",bpm); f.feedback=0.3; f.mix=0.2; }},
      {id:"slap",label:"スラップ",apply(f){ f.sync="off"; f.time=0.09; f.feedback=0.08; f.mix=0.18; }},
      {id:"long",label:"ロング（4分・反復多め）",apply(f,bpm){ f.sync="4"; f.time=delaySyncSec("4",bpm); f.feedback=0.5; f.mix=0.22; }},
    ]},
};
function defaultFx(type){ const d=FXDEF[type]; return d?d.make():null; }
function fxSnapshot(fx){ const c=JSON.parse(JSON.stringify(fx)); delete c.on; delete c.collapsed; return c; }
function fxPresetKey(type,preset){ const f=defaultFx(type); preset.apply(f,S.bpm); return JSON.stringify(fxSnapshot(f)); }
function setFxParams(fx,data){ const on=fx.on, col=fx.collapsed; for(const k of Object.keys(fx)) delete fx[k];
  Object.assign(fx,JSON.parse(JSON.stringify(data))); fx.on=on; if(col!=null) fx.collapsed=col; }
function applyFxPreset(tr,i,preset){
  const fx=tr.fx[i]; if(!fx) return;
  if(preset.data){ setFxParams(fx,preset.data); }
  else { const f=defaultFx(fx.type); preset.apply(f,S.bpm); setFxParams(fx,f); }
  applyFxLive(tr,i,true); renderInspector();
  toast("プリセット「"+preset.label+"」を "+FXDEF[fx.type].name+" に適用しました");
}
/* ============================================================
   クリップ／ルーティング・モジュール（第3段リファクタ）
   ------------------------------------------------------------
   第1段（ピッチ層）・第2段（FX段）と同じ規律を、クリップと
   ミキサー／ルーティングにも適用する:
   - クリップは独立ユニット: 選択・ミュート（無効化）・複製・削除・
     プリセットがクリップ単位で効く。編集（トリム／ゲイン／フェード／
     ミュート）はパラメータだけを変え、原音バッファは書き換えない
     （＝クリップ編集も非破壊レイヤー。ピッチ層とは別に重なる）。
   - バス／リターンは独立ユニット: ON/OFF（ミュート）・音量・パン・
     要約表示を持ち、トラックの送り先はミキサー側からも変えられる。
   - ミキサー全体にはプリセット（組み込み＋ユーザー保存＝
     セッション内のみ）を置き、フェーダー／パン／センド／バス／
     リターンをまとめて呼び出せる。初期値・既定の配線は従来と同一。
   ============================================================ */
const CLIP_PRESETS=[
  {id:"plain",label:"標準（フェードなし）",apply(c){ c.gain=0; c.fadeIn=0; c.fadeOut=0; }},
  {id:"click",label:"クリック除去（10ms）",apply(c){ c.fadeIn=Math.min(0.01,c.dur/4); c.fadeOut=Math.min(0.01,c.dur/4); }},
  {id:"smooth",label:"滑らかに入り・抜ける",apply(c){ c.fadeIn=Math.min(0.08,c.dur/4); c.fadeOut=Math.min(0.15,c.dur/4); }},
  {id:"longfade",label:"ロングフェード",apply(c){ c.fadeIn=Math.min(0.4,c.dur/3); c.fadeOut=Math.min(0.8,c.dur/3); }},
  {id:"down3",label:"ゲイン −3dB",apply(c){ c.gain=-3; }},
  {id:"up3",label:"ゲイン +3dB",apply(c){ c.gain=3; }},
];
function clipSummary(cl){
  if(!cl) return "";
  const parts=[cl.start.toFixed(2)+"s → "+(cl.start+cl.dur).toFixed(2)+"s（"+cl.dur.toFixed(2)+"s）",
    "ゲイン "+fmtDb(cl.gain||0)];
  if(cl.fadeIn>0||cl.fadeOut>0) parts.push("フェード "+(cl.fadeIn||0).toFixed(2)+"/"+(cl.fadeOut||0).toFixed(2)+"s");
  if(cl.muted) parts.push("ミュート中");
  const L=(typeof pitchLayer==="function")?pitchLayer(cl):null;
  if(L) parts.push("ピッチ層 "+(L.enabled?"ON":"OFF")+" "+L.notes.length+"ノート");
  return parts.join(" ・ ");
}
function clipPresetMatch(cl,p){ const c={gain:cl.gain||0,fadeIn:cl.fadeIn||0,fadeOut:cl.fadeOut||0,dur:cl.dur}; p.apply(c);
  return Math.abs(c.gain-(cl.gain||0))<1e-9&&Math.abs(c.fadeIn-(cl.fadeIn||0))<1e-9&&Math.abs(c.fadeOut-(cl.fadeOut||0))<1e-9; }
function applyClipPreset(cl,p){ p.apply(cl); renderTimeline(); renderInspector(); if(S.playing) startSources(currentPos());
  toast("クリッププリセット「"+p.label+"」を適用しました（原音は不変）"); }
function duplicateClip(tr,cl){
  const nc={id:nid(),name:cl.name+" (複製)",buffer:cl.buffer,sourceBuffer:cl.sourceBuffer||cl.buffer,

      [56,"D5",1],[57,"C5",1],[58,"A4",1.5],[59.5,"G4",0.5],[60,"E4",1],[61,"D4",1],[62,"C4",2]];
    const third={C4:"E4",D4:"F4",E4:"G4",G4:"B4",A4:"C5",B3:"D4",C5:"E5",D5:"F5",E5:"G5"};

/* ============================================================
   ファイル読み込み
   ============================================================ */
async function importFiles(files){
  ensureCtx();
  const list=[...files].filter(f=>/audio|\.(wav|mp3|m4a|ogg|flac)$/i.test(f.type+" "+f.name));
  if(!list.length){ toast("音声ファイルが見つかりませんでした"); return; }
  for(const f of list){
    try{
      const buf=await S.ctx.decodeAudioData(await f.arrayBuffer());
      const nm=f.name.replace(/\.[^.]+$/,"");
      const type=/ハモ|harmony|chorus/i.test(nm)?"harmony":(/オケ|inst|off|karaoke|伴奏/i.test(nm)?"inst":"vocal");
      const tr=newTrack(nm,type);
      tr.clips.push({id:nid(),name:nm,buffer:buf,start:0,offset:0,dur:buf.duration,gain:0,fadeIn:0,fadeOut:0});
      if(type!=="inst") tr.bus=S.buses[0].id;
      S.tracks.push(tr); buildTrackGraph(tr); S.selTrack=tr.id;
      toast("読み込み: "+f.name);
    }catch(e){ toast("読み込めませんでした: "+f.name); }
  }
  renderTimeline(); renderInspector();
}

   タイムライン描画
   ============================================================ */
const headsEl=$("#heads"), lanesEl=$("#lanes"), rulerEl=$("#ruler");
function contentW(){ return Math.ceil(projectEnd()*S.px)+80; }
function beatSec(){ return 60/S.bpm; }
function drawRuler(){
  const w=contentW(); rulerEl.width=w; rulerEl.style.width=w+"px";
  const c=rulerEl.getContext("2d"); c.clearRect(0,0,w,30);
  const cs=getComputedStyle(document.documentElement);
  c.fillStyle=cs.getPropertyValue("--tx3"); c.strokeStyle=cs.getPropertyValue("--grid");
  c.font="10px "+cs.getPropertyValue("--mono"); c.textBaseline="top";
  const bs=beatSec();
  for(let b=0;b*bs<projectEnd()+4;b++){
    const x=Math.round(b*bs*S.px)+0.5, isBar=b%4===0;
    c.beginPath(); c.moveTo(x,isBar?8:20); c.lineTo(x,30); c.stroke();
    if(isBar) c.fillText(String(b/4+1),x+4,3);
  }
  if(S.loop.on){
    c.fillStyle="rgba(226,87,76,.28)";
    c.fillRect(S.loop.start*S.px,0,(S.loop.end-S.loop.start)*S.px,30);
  }
}
function drawWave(canvas,cl){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=canvas.clientWidth||Math.round(cl.dur*S.px), h=canvas.clientHeight||80;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const c=canvas.getContext("2d"); c.scale(dpr,dpr);
  c.fillStyle="rgba(255,255,255,.16)"; c.fillRect(0,0,w,h);
  const buf=cl.buffer; if(!buf){return;}
  const ch0=buf.getChannelData(0), ch1=buf.numberOfChannels>1?buf.getChannelData(1):ch0;
  const startS=Math.floor(cl.offset*buf.sampleRate), lenS=Math.floor(cl.dur*buf.sampleRate);
  c.fillStyle="rgba(255,255,255,.85)";
  const mid=h/2;
  for(let x=0;x<w;x++){
    const s0=startS+Math.floor(x/w*lenS), s1=startS+Math.floor((x+1)/w*lenS);
    let mx=0; const step=Math.max(1,((s1-s0)/40)|0);
    for(let i=s0;i<s1&&i<ch0.length;i+=step){ const v=Math.abs(ch0[i])+Math.abs(ch1[i]); if(v>mx)mx=v; }
    const y=clamp(mx*0.5,0.02,1)*(mid-3);
    c.fillRect(x,mid-y,1,Math.max(1,y*2));
  }
  /* fades */
  c.fillStyle="rgba(0,0,0,.35)";
  if(cl.fadeIn>0){ const fw=cl.fadeIn*S.px; c.beginPath(); c.moveTo(0,0); c.lineTo(fw,0); c.lineTo(0,h); c.closePath(); c.fill(); }
  if(cl.fadeOut>0){ const fw=cl.fadeOut*S.px; c.beginPath(); c.moveTo(w,0); c.lineTo(w-fw,0); c.lineTo(w,h); c.closePath(); c.fill(); }
}

    lanesEl.appendChild(ln);
  });
  drawRuler(); updatePlayhead();
  $("#headInfo").textContent=S.tracks.length+" trk";

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function panLabel(p){ return p===0?"C":(p<0?"L"+Math.round(-p*100):"R"+Math.round(p*100)); }
function selectTrack(id){ S.selTrack=id; S.selFx=S.tracks.find(t=>t.id===id)?.fx.length?0:-1; renderTimeline(); renderInspector(); }
function selTrackObj(){ return S.tracks.find(t=>t.id===S.selTrack)||S.tracks[0]; }
function findClip(id){ for(const tr of S.tracks){ const cl=tr.clips.find(c=>c.id===id); if(cl) return {tr,cl}; } return null; }

/* ---------- clip drag / trim ---------- */
function clipPointer(e,tr,cl,el){
  if(e.button!==0) return;
  e.preventDefault(); selectTrackSilent(tr.id); S.selClip=cl.id; renderTimeline(); renderInspector();
  /* re-render replaced the DOM: find this clip's fresh element */
  const lane2=lanesEl.querySelector(`.lane[data-tid="${tr.id}"]`); if(!lane2) return;
  const idx=tr.clips.indexOf(cl); const el2=lane2.querySelectorAll(".clip")[idx]; if(!el2) return;
  const x0=e.clientX;
  const mode=e.target.classList.contains("l")?"trimL":(e.target.classList.contains("r")?"trimR":"move");
  const orig={start:cl.start,offset:cl.offset,dur:cl.dur};
  const snapT=t=>{ if(!S.snap||e.altKey) return t; const g=beatSec()/2; return Math.round(t/g)*g; };
  function mv(ev){
    const dt=(ev.clientX-x0)/S.px;
    if(mode==="move"){ cl.start=Math.max(0,snapT(orig.start+dt)); }
    else if(mode==="trimL"){ const ns=clamp(snapT(orig.start+dt),Math.max(0,orig.start-orig.offset),orig.start+orig.dur-0.05);
      cl.offset=orig.offset+(ns-orig.start); cl.dur=orig.dur-(ns-orig.start); cl.start=ns; }
    else { cl.dur=clamp(orig.dur+dt,0.05,cl.buffer.duration-cl.offset); if(S.snap&&!ev.altKey){ const g=beatSec()/2; cl.dur=Math.max(0.05,Math.round(cl.dur/g)*g); } }
    el2.style.left=(cl.start*S.px)+"px"; el2.style.width=Math.max(8,cl.dur*S.px)+"px";
  }
  function up(){ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up);
    drawWave(el2.querySelector("canvas"),cl); renderInspector(); if(S.playing) startSources(currentPos()); }
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
}
function selectTrackSilent(id){ S.selTrack=id; }

/* ---------- ruler: seek & loop ---------- */
(function(){
  let drag=null;
  rulerEl.addEventListener("pointerdown",e=>{
    const r=rulerEl.getBoundingClientRect(); const t=(e.clientX-r.left)/S.px;
    drag={t0:t,moved:false}; rulerEl.setPointerCapture(e.pointerId);
  });
  rulerEl.addEventListener("pointermove",e=>{
    if(!drag) return; const r=rulerEl.getBoundingClientRect(); const t=(e.clientX-r.left)/S.px;
    if(Math.abs(t-drag.t0)>4/S.px){ drag.moved=true; S.loop.start=Math.min(drag.t0,t); S.loop.end=Math.max(drag.t0,t); S.loop.on=true; $("#btnLoop").classList.add("on"); drawRuler(); }
  });
  rulerEl.addEventListener("pointerup",e=>{
    if(!drag) return;
    if(!drag.moved) seek(drag.t0); else if(S.playing){ S.pos=S.loop.start; startSources(S.pos); }
    drag=null;
  });
})();

/* ---------- automation editing ---------- */
function sizeAutoCanvas(ac,tr){ const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=ac.clientWidth||contentW(), h=ac.clientHeight||96;
  ac.width=w*dpr; ac.height=h*dpr; ac.getContext("2d").scale(dpr,dpr); ac._w=w; ac._h=h; }
function autoY2V(y,h){ return S.autoMode==="volume"? clamp(6-(y/h)*72,-60,6) : clamp(1-(y/h)*2,-1,1); }
function autoV2Y(v,h){ return S.autoMode==="volume"? (6-v)/72*h : (1-v)/2*h; }
function drawAuto(ac,tr){
  const c=ac.getContext("2d"), w=ac._w, h=ac._h; if(!w) return;
  c.clearRect(0,0,w,h);
  c.fillStyle=S.autoMode==="volume"?"rgba(226,87,76,.10)":"rgba(76,141,226,.10)"; c.fillRect(0,0,w,h);
  const pts=[...tr.auto[S.autoMode]].sort((a,b)=>a.t-b.t);
  const defV=S.autoMode==="volume"?tr.vol:tr.pan;
  const drawPts=pts.length?pts:[{t:0,v:defV}];
  const trace=()=>{ c.beginPath(); c.moveTo(0,autoV2Y(drawPts[0].v,h));
    drawPts.forEach(p=>c.lineTo(p.t*S.px,autoV2Y(p.v,h)));
    c.lineTo(w,autoV2Y(drawPts[drawPts.length-1].v,h)); };
  c.strokeStyle="rgba(0,0,0,.45)"; c.lineWidth=5; trace(); c.stroke();
  c.strokeStyle=S.autoMode==="volume"?"#ff7a6e":"#7db3f0"; c.lineWidth=2.5; trace(); c.stroke();
  c.fillStyle="#fff";
  pts.forEach(p=>{ c.beginPath(); c.arc(p.t*S.px,autoV2Y(p.v,h),5,0,7); c.fill();
    c.strokeStyle=S.autoMode==="volume"?"#e2574c":"#4c8de2"; c.stroke(); });
  c.fillStyle="rgba(255,255,255,.75)"; c.font="11px sans-serif";
  c.fillText(S.autoMode==="volume"?"ボリューム・オートメーション（クリックで点を追加、右クリックで削除）":"パン・オートメーション（クリックで点を追加、右クリックで削除）",10,16);
}
function autoPointer(e,tr,ac){
  e.preventDefault();
  const r=ac.getBoundingClientRect(); const h=ac._h||ac.clientHeight;
  const t=(e.clientX-r.left)/S.px, v=autoY2V(e.clientY-r.top,h);
  const pts=tr.auto[S.autoMode];
  let hit=pts.findIndex(p=>Math.abs(p.t-t)<8/S.px&&Math.abs(autoV2Y(p.v,h)-(e.clientY-r.top))<10);
  if(e.button===2){ if(hit>=0){ pts.splice(hit,1); drawAuto(ac,tr); if(S.playing)startSources(currentPos()); } return; }
  if(hit<0){ pts.push({t:Math.max(0,t),v}); pts.sort((a,b)=>a.t-b.t); hit=pts.findIndex(p=>p.t===Math.max(0,t)); }
  const p=pts[hit]; if(!p) return;
  function mv(ev){ const nt=clamp((ev.clientX-r.left)/S.px,0,projectEnd());
    p.t=S.snap?Math.round(nt/(beatSec()/4))*(beatSec()/4):nt; p.v=autoY2V(ev.clientY-r.top,h);
    pts.sort((a,b)=>a.t-b.t); drawAuto(ac,tr); }
  function up(){ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up);
    if(S.playing) startSources(currentPos()); }
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
  drawAuto(ac,tr);
}

  /* --- クリップ一覧: 各クリップは独立ユニット（選択・ミュート・複製・削除・要約） --- */

    <div class="fxmeta"><span class="t">${esc(c.name)}</span><span class="fxsum">${esc(clipSummary(c))}</span>
    <div class="fxacts"><button data-cact="dup" title="このクリップを複製">複製</button><button data-cact="del" title="このクリップを削除">✕</button></div></div>
    <button data-cact="mute" class="fxpower ${c.muted?"":"on"}" title="このクリップだけ ON/OFF（ミュート）">${c.muted?"OFF":"ON"}</button></div>`).join(""):"<p class='small'>このトラックにクリップはありません</p>"}
  </div>`;
  if(cl){
    h+=`<div class="sect" style="min-width:min(300px,100%);flex:1"><h3>選択クリップ — ${esc(cl.name)}</h3>
    <div class="layerstack" style="margin-bottom:10px">
      <div class="layercard src"><div class="layer-ico">♪</div><div class="layer-main"><b>原音（ソース）</b><span class="badge" style="background:#5b7a2a;margin-left:6px">常に保持</span><p>元音源オフセット ${cl.offset.toFixed(2)} 秒 — トリム／ゲイン／フェードでは書き換わりません。</p></div></div>
      <div class="layer-arrow">↓ &nbsp;パラメータだけを重ねる</div>
      <div class="layercard ${cl.muted?"off":"active"}"><div class="layer-ico">✂</div><div class="layer-main"><b>クリップ編集レイヤー</b> ${cl.muted?`<span class="badge" style="background:#6e7488;margin-left:6px">ミュート中</span>`:""}
      <p>${esc(clipSummary(cl))}</p></div>
      <div style="display:flex;flex-direction:column;gap:6px;flex:none"><button id="clMuteBtn">${cl.muted?"ミュート解除":"ミュート"}</button><button id="clDupBtn" class="ghost">複製</button></div></div>
    </div>
    <div class="fxpresetbar"><span class="cap">PRESET</span>
      <div class="fxchips">${CLIP_PRESETS.map(p=>`<button data-clippreset="${p.id}" class="${clipPresetMatch(cl,p)?"on":""}">${p.label}</button>`).join("")}</div></div>

function wireCh(){
  const tr=selTrackObj(); if(!tr) return;
  const R=(id,fn)=>{ const el=$(id); if(el) el.addEventListener("input",fn); };
  R("#chName",e=>{ tr.name=e.target.value; renderTimeline(); });
  $("#chType").addEventListener("change",e=>{ tr.type=e.target.value; tr.color=TYPES[tr.type].color; renderTimeline(); });
  $("#chBus").addEventListener("change",e=>{ tr.bus=e.target.value||null; refreshTrackOut(tr); });
  R("#chVol",e=>{ tr.vol=parseFloat(e.target.value); e.target.nextElementSibling.textContent=fmtDb(tr.vol);
    if(tr.nodes)tr.nodes.fader.gain.setTargetAtTime(db2lin(tr.vol),S.ctx.currentTime,0.03); renderTimelineSoft(); });
  R("#chPan",e=>{ tr.pan=parseFloat(e.target.value)/100; e.target.nextElementSibling.textContent=panLabel(tr.pan);
    if(tr.nodes)tr.nodes.pan.pan.setTargetAtTime(tr.pan,S.ctx.currentTime,0.03); renderTimelineSoft(); });
  R("#chSendR",e=>{ tr.sendRev=parseFloat(e.target.value)/100; e.target.nextElementSibling.textContent=e.target.value+"%";
    if(tr.nodes)tr.nodes.sRev.gain.setTargetAtTime(tr.sendRev,S.ctx.currentTime,0.03); });
  R("#chSendD",e=>{ tr.sendDly=parseFloat(e.target.value)/100; e.target.nextElementSibling.textContent=e.target.value+"%";
    if(tr.nodes)tr.nodes.sDly.gain.setTargetAtTime(tr.sendDly,S.ctx.currentTime,0.03); });
  $$(".busVol").forEach(el=>el.addEventListener("input",()=>{ const b=S.buses.find(x=>x.id===el.dataset.bus);
    b.vol=parseFloat(el.value); el.nextElementSibling.textContent=fmtDb(b.vol);
    if(b.nodes)b.nodes.g.gain.setTargetAtTime(b.muted?0:db2lin(b.vol),S.ctx.currentTime,0.03); }));
  $$("[data-busmute]").forEach(btn=>btn.addEventListener("click",()=>{ const b=S.buses.find(x=>x.id===btn.dataset.busmute); if(!b) return;
    b.muted=!b.muted; if(b.nodes&&S.ctx) b.nodes.g.gain.setTargetAtTime(b.muted?0:db2lin(b.vol),S.ctx.currentTime,0.03); renderInspector(); }));
  /* クリップ一覧（独立ユニット）: 選択・ミュート・複製・削除 */
  $$(".clipitem").forEach(item=>{ const cid=item.dataset.clip;
    item.addEventListener("click",e=>{ const act=e.target.dataset&&e.target.dataset.cact; const c=tr.clips.find(x=>x.id===cid); if(!c) return;
      if(act==="mute"){ c.muted=!c.muted; renderTimeline(); renderInspector(); if(S.playing)startSources(currentPos()); return; }
      if(act==="dup"){ duplicateClip(tr,c); return; }
      if(act==="del"){ S.selClip=cid; deleteSelected(); return; }
      if(!act){ S.selClip=cid; renderTimeline(); renderInspector(); } }); });
  const ab=$("#btnAddBus"); if(ab) ab.onclick=()=>{ const nm=($("#newBusName").value||"バス").trim();
    const b=newBus(nm); S.buses.push(b); if(S.ctx)buildBusGraph(b); renderInspector(); toast("バス「"+nm+"」を追加しました"); };
  R("#retDecay",e=>{ const v=parseFloat(e.target.value); e.target.nextElementSibling.textContent=v.toFixed(1)+" 秒";
    if(S.returns){ S.returns.decay=v; S.returns.conv.buffer=makeIR(S.ctx,v); } });
  R("#retDlyT",e=>{ const v=parseFloat(e.target.value); e.target.nextElementSibling.textContent=Math.round(v*1000)+" ms";
    if(S.returns){ S.returns.dlyTime=v; S.returns.dly.delayTime.setTargetAtTime(v,S.ctx.currentTime,0.03); } });
  R("#retDlyF",e=>{ const v=parseFloat(e.target.value); e.target.nextElementSibling.textContent=Math.round(v*100)+"%";
    if(S.returns){ S.returns.dlyFb=v; S.returns.fb.gain.setTargetAtTime(v,S.ctx.currentTime,0.03); } });
  const fc=findClip(S.selClip); if(fc&&fc.tr.id===tr.id){ const cl=fc.cl;
    R("#clStart",e=>{ cl.start=Math.max(0,parseFloat(e.target.value)||0); renderTimeline(); });
    R("#clGain",e=>{ cl.gain=parseFloat(e.target.value); e.target.nextElementSibling.textContent=fmtDb(cl.gain); if(S.playing)startSources(currentPos()); });
    R("#clFI",e=>{ cl.fadeIn=clamp(parseFloat(e.target.value)||0,0,cl.dur); renderTimeline(); if(S.playing)startSources(currentPos()); });
    R("#clFO",e=>{ cl.fadeOut=clamp(parseFloat(e.target.value)||0,0,cl.dur); renderTimeline(); if(S.playing)startSources(currentPos()); });
    $$("[data-clippreset]").forEach(b=>b.addEventListener("click",()=>{ const p=CLIP_PRESETS.find(x=>x.id===b.dataset.clippreset); if(p) applyClipPreset(cl,p); }));
    const mb=$("#clMuteBtn"); if(mb) mb.onclick=()=>{ cl.muted=!cl.muted; renderTimeline(); renderInspector(); if(S.playing)startSources(currentPos()); };
    const dp=$("#clDupBtn"); if(dp) dp.onclick=()=>duplicateClip(fc.tr,cl);
    const cb=$("#clCollapseBtn"); if(cb) cb.onclick=()=>{ cl.collapsed=true; renderInspector(); };
    const eb=$("#clExpandBtn"); if(eb) eb.onclick=()=>{ cl.collapsed=false; renderInspector(); };
    const sp=$("#clSplit2"); if(sp) sp.onclick=splitSelected;
    const dl=$("#clDel2"); if(dl) dl.onclick=deleteSelected;
  }
}
function renderTimelineSoft(){ /* ヘッダーのフェーダー表示だけ同期（全体再描画は入力中フォーカスを壊すため避ける） */ syncMixer(); }

const FXNAMES={eq:"パラメトリックEQ",comp:"コンプレッサー",reverb:"リバーブ",delay:"ディレイ"};
function fxHTML(){

      {k:"mix",label:"ミックス Mix",min:0,max:1,step:0.01,val:fx.mix,unit:"%",fmt:v=>Math.round(v*100)}]);

      {k:"mix",label:"ミックス Mix",min:0,max:1,step:0.01,val:fx.mix,unit:"%",fmt:v=>Math.round(v*100)}])+
      `<div class="fld" style="margin-top:10px"><label style="width:auto">拍同期</label><select id="dlySync">

  }
  return `<div class="fxwrap"><div class="chain"><h3 style="margin:0 0 4px;font-size:12px;color:var(--tx2)">インサート — ${esc(tr.name)}（直列チェーン）</h3>

    <button id="btnAddFx">＋ 段を追加</button></div></div>

function wireFx(){
  const tr=selTrackObj(); if(!tr) return;
  $$(".fxitem").forEach(item=>{
    const i=parseInt(item.dataset.i);
    item.addEventListener("click",e=>{
      const act=e.target.dataset&&e.target.dataset.act;
      if(act==="on"){ tr.fx[i].on=!tr.fx[i].on; applyFxLive(tr,i); renderInspector(); return; }
      if(act==="del"){ tr.fx.splice(i,1); S.selFx=-1; applyFxLive(tr,i,true); renderInspector(); return; }
      if(act==="up"&&i>0){ [tr.fx[i-1],tr.fx[i]]=[tr.fx[i],tr.fx[i-1]]; S.selFx=i-1; applyFxLive(tr,i,true); renderInspector(); return; }
      if(act==="down"&&i<tr.fx.length-1){ [tr.fx[i+1],tr.fx[i]]=[tr.fx[i],tr.fx[i+1]]; S.selFx=i+1; applyFxLive(tr,i,true); renderInspector(); return; }
      if(!act){ S.selFx=i; renderInspector(); }
    });
    item.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain",String(i)); });
    item.addEventListener("dragover",e=>e.preventDefault());

  $$("[data-ufxpreset]").forEach(b=>b.addEventListener("click",()=>{ const fx=tr.fx[S.selFx]; if(!fx) return;

  else { $$(".knob input").forEach(inp=>inp.addEventListener("input",()=>{
    fx[inp.dataset.k]=parseFloat(inp.value);

    applyFxLive(tr,S.selFx); }));

      const b=60/S.bpm; const map={"4":b,"d8":b*0.75,"8":b/2,"16":b/4,"t8":b/3};
      if(map[fx.sync]){ fx.time=map[fx.sync]; applyFxLive(tr,S.selFx); renderInspector(); } });
  }
}
function compFmt(k,v){ return {threshold:v.toFixed(1)+" dB",ratio:v.toFixed(1)+" : 1",attack:Math.round(v*1000)+" ms",release:Math.round(v*1000)+" ms",knee:v.toFixed(0)+" dB",makeup:"+"+v.toFixed(1)+" dB"}[k]; }
function fxFmt(type,k,v){ if(k==="mix"||k==="feedback") return Math.round(v*100)+"%";
  if(k==="decay") return v.toFixed(1)+" 秒"; if(k==="predelay") return Math.round(v*1000)+" ms";
  if(k==="time") return Math.round(v*1000)+" ms"; return String(v); }
/* EQ graph */
function wireEq(tr,fx){
  const cv=$("#eqCanvas"); if(!cv) return;
  $$("[data-bf]").forEach(inp=>inp.addEventListener("input",()=>{ fx.bands[+inp.dataset.bf].f=clamp(parseFloat(inp.value)||100,20,20000); applyFxLive(tr,S.selFx); drawEq(cv,fx); }));
  $$("[data-bg]").forEach(inp=>inp.addEventListener("input",()=>{ fx.bands[+inp.dataset.bg].g=clamp(parseFloat(inp.value)||0,-24,24); applyFxLive(tr,S.selFx); drawEq(cv,fx); }));
  $$("[data-bq]").forEach(inp=>inp.addEventListener("input",()=>{ fx.bands[+inp.dataset.bq].q=clamp(parseFloat(inp.value)||1,0.1,18); applyFxLive(tr,S.selFx); drawEq(cv,fx); }));
  $$("[data-bt]").forEach(sel=>sel.addEventListener("change",()=>{ fx.bands[+sel.dataset.bt].t=sel.value; applyFxLive(tr,S.selFx); renderInspector(); }));
  $$("[data-bon]").forEach(b=>b.addEventListener("click",()=>{ const bd=fx.bands[+b.dataset.bon]; bd.on=!bd.on; applyFxLive(tr,S.selFx); renderInspector(); }));
  drawEq(cv,fx);
  let dragB=-1;
  const pos2fb=(x,y,w,h)=>{ const f=20*Math.pow(1000,x/w); const g=clamp(18-(y/h)*36,-24,24); return {f,g}; };
  cv.addEventListener("pointerdown",e=>{ const r=cv.getBoundingClientRect();
    const x=e.clientX-r.left,y=e.clientY-r.top;
    let best=1e9; fx.bands.forEach((b,i)=>{ const bx=Math.log10(b.f/20)/3*r.width, by=(18-b.g)/36*r.height;
      const d=(bx-x)**2+(by-y)**2; if(d<best){best=d;dragB=i;} });
    if(best>30*30) dragB=-1;
    if(dragB>=0){ cv.setPointerCapture(e.pointerId); moveEq(e); } });
  function moveEq(e){ if(dragB<0) return; const r=cv.getBoundingClientRect();
    const {f,g}=pos2fb(e.clientX-r.left,e.clientY-r.top,r.width,r.height);
    const b=fx.bands[dragB]; b.f=clamp(f,20,20000); if(!["highpass","lowpass","notch"].includes(b.t)) b.g=g;
    applyFxLive(tr,S.selFx); drawEq(cv,fx); syncEqNums(fx); }
  cv.addEventListener("pointermove",moveEq);
  cv.addEventListener("pointerup",()=>dragB=-1);
  cv.addEventListener("wheel",e=>{ const r=cv.getBoundingClientRect(); const x=e.clientX-r.left;
    let best=1e9,bi=-1; fx.bands.forEach((b,i)=>{ const bx=Math.log10(b.f/20)/3*r.width; const d=Math.abs(bx-x); if(d<best){best=d;bi=i;} });
    if(bi>=0){ e.preventDefault(); const b=fx.bands[bi]; b.q=clamp(b.q*(e.deltaY<0?1.15:0.87),0.1,18);
      applyFxLive(tr,S.selFx); drawEq(cv,fx); syncEqNums(fx); } },{passive:false});
}
function syncEqNums(fx){ $$("[data-bf]").forEach(inp=>inp.value=Math.round(fx.bands[+inp.dataset.bf].f));
  $$("[data-bg]").forEach(inp=>inp.value=fx.bands[+inp.dataset.bg].g.toFixed(1));
  $$("[data-bq]").forEach(inp=>inp.value=fx.bands[+inp.dataset.bq].q.toFixed(2)); }
function drawEq(cv,fx){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth, h=cv.clientHeight; if(!w) return;
  cv.width=w*dpr; cv.height=h*dpr; const c=cv.getContext("2d"); c.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  c.fillStyle=cs.getPropertyValue("--bg"); c.fillRect(0,0,w,h);
  c.strokeStyle=cs.getPropertyValue("--grid"); c.fillStyle=cs.getPropertyValue("--tx3"); c.font="10px sans-serif";
  [50,100,200,500,1000,2000,5000,10000].forEach(f=>{ const x=Math.log10(f/20)/3*w;
    c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke(); c.fillText(f>=1000?(f/1000)+"k":f,x+3,h-4); });
  const y0=(18)/36*h; c.strokeStyle=cs.getPropertyValue("--gridbar");
  c.beginPath();c.moveTo(0,y0);c.lineTo(w,y0);c.stroke();
  /* response */
  const N=140, fr=new Float32Array(N), mg=new Float32Array(N), ph=new Float32Array(N);
  for(let i=0;i<N;i++) fr[i]=20*Math.pow(1000,i/(N-1));
  const tot=new Float32Array(N);
  const tmpCtx=S.ctx||null;
  fx.bands.forEach(b=>{
    if(!tmpCtx||!b.on){ if(b.on){ /* analytic fallback skipped */ } return; }
    const node=tmpCtx.createBiquadFilter(); node.type=b.t; node.frequency.value=b.f; node.gain.value=b.g; node.Q.value=b.q;
    node.getFrequencyResponse(fr,mg,ph);
    for(let i=0;i<N;i++) tot[i]+=20*Math.log10(mg[i]||1e-6);
  });
  c.beginPath();
  for(let i=0;i<N;i++){ const x=i/(N-1)*w, y=(18-clamp(tot[i],-30,30))/36*h; i?c.lineTo(x,y):c.moveTo(x,y); }
  c.strokeStyle="#f0823c"; c.lineWidth=2; c.stroke();
  c.lineTo(w,h); c.lineTo(0,h); c.closePath(); c.fillStyle="rgba(240,130,60,.15)"; c.fill();
  const cols=["#b85a4e","#c9a86a","#4d8a7a","#6d84a3","#9a7fa8"];
  fx.bands.forEach((b,i)=>{ const x=Math.log10(b.f/20)/3*w, y=(18-b.g)/36*h;
    c.beginPath(); c.arc(x,y,9,0,7); c.fillStyle=b.on?cols[i]:"#666"; c.fill();
    c.fillStyle="#fff"; c.font="bold 10px sans-serif"; c.textAlign="center"; c.fillText(String(i+1),x,y+3.5); c.textAlign="left"; });
}

function encodeWav(buf,bits){

  v.setUint16(20,1,true); v.setUint16(22,nCh,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*block,true); v.setUint16(32,block,true); v.setUint16(34,bits,true);
  ws(36,"data"); v.setUint32(40,dataLen,true);
  const L=buf.getChannelData(0), R=buf.numberOfChannels>1?buf.getChannelData(1):L;
  let o=44;
  for(let i=0;i<len;i++){ for(const ch of [L,R]){ const s=clamp(ch[i],-1,1);
    if(bits===16){ v.setInt16(o,Math.round(s*32767),true); o+=2; }

    const to16=d=>{ const o=new Int16Array(d.length); for(let i=0;i<d.length;i++)o[i]=Math.round(clamp(d[i],-1,1)*32767); return o; };
    const l16=to16(L), r16=to16(R), parts=[]; const CH=1152;

/* ============================================================
   ピッチ補正 — 非破壊レイヤー（DaVinci Resolve型 / 第1段リファクタ）
   ------------------------------------------------------------
   構造: 検出 PitchDetect / ノート分割 NoteSegment / 適用 PitchShift を
   独立したモジュール境界に分け、差し替え可能にしてある。

   非破壊の原則:
   - 原音は clip.buffer（= clip.sourceBuffer）に固定し、一切書き換えない。
     解析・補正・リセット・レイヤー削除のどれを行っても原音は残る。
   - 補正は clip.pitchLayer という「パラメータの層」だけに保存する。
     再生・書き出しは clipBuffer() が原音＋レイヤーから都度導出する。
     導出結果のキャッシュ（clip._corrCache）は使い捨てで、正本ではない。
     レイヤーを変えれば再導出され、OFFにすれば即座に原音に戻る。

   clip.pitchLayer = { version:2, enabled, strength, notes:[Note,...] }
     enabled  : レイヤー全体の ON/OFF（A/B比較はこれで切り替える）
     strength : 補正の強さ 0..1。実効シフト = shift × strength。

     start/end : 元バッファ内の時刻（秒）。トリム・分割しても座標は不変
     f0 / midi : 検出値（midi は小数。例 60.25 = C4 +25セント）
     shift     : 補正量（半音・小数可）。ドラッグは半音単位、スナップは
                 最寄りの整数 midi へ寄せるため小数になり得る
     enabled   : ノート単位の ON/OFF（false のノートは原音のまま）

   pitchLayer へ移行する（移行後は pitchLayer が正本）。

const PitchDetect={

  _frame(d,sr,tauMin,tauMax,t){
    let rms=0; for(let i=0;i<d.length;i++) rms+=d[i]*d[i];
    if(Math.sqrt(rms/d.length)<0.008) return {t,f0:0,voiced:false};
    const W=d.length, df=new Float32Array(tauMax+2), cmnd=new Float32Array(tauMax+2);
    for(let tau=tauMin;tau<=tauMax;tau++){ let s=0; const lim=W-tau;
      for(let i=0;i<lim;i++){ const dd=d[i]-d[i+tau]; s+=dd*dd; } df[tau]=s; }
    cmnd[0]=1; let run=0;
    for(let tau=1;tau<=tauMax;tau++){ run+=df[tau]; cmnd[tau]=run>0?df[tau]*tau/run:1; }
    let tau=-1; const TH=0.15;
    for(let x=Math.max(2,tauMin);x<=tauMax;x++){
      if(cmnd[x]<TH){ while(x+1<=tauMax&&cmnd[x+1]<cmnd[x]) x++; tau=x; break; } }
    if(tau<0){ let m=Infinity; for(let x=tauMin;x<=tauMax;x++){ if(cmnd[x]<m){m=cmnd[x];tau=x;} }
      if(m>0.4) return {t,f0:0,voiced:false}; }
    let sh=0;
    if(tau>tauMin&&tau<tauMax){ const a=cmnd[tau-1],b=cmnd[tau],c=cmnd[tau+1],den=a-2*b+c;
      if(Math.abs(den)>1e-9) sh=0.5*(a-c)/den; }
    const f0=sr/(tau+sh);
    if(f0<50||f0>1100) return {t,f0:0,voiced:false};
    return {t,f0,voiced:true};
  }
};

/* ---------- (2) ノート分割: フレーム列 → 音符ブロック ---------- */
const NoteSegment={
  segment(frames){
    const hopDur=frames.length>1?frames[1].t-frames[0].t:0.016;
    const med=a=>{ const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
    const notes=[]; let cur=null, dev=null, gap=0;
    const flush=()=>{ if(cur&&cur.midis.length){ const m=med(cur.midis);
        notes.push({id:nid(),start:cur.start,end:cur.end,f0:440*Math.pow(2,(m-69)/12),midi:m,shift:0,enabled:true}); }
      cur=null; dev=null; };
    frames.forEach(fr=>{
      if(!fr.voiced){ gap++; if(gap>3){ flush(); gap=0; } return; }
      gap=0;
      const m=69+12*Math.log2(fr.f0/440);
      if(!cur){ cur={start:fr.t,end:fr.t+hopDur,midis:[m]}; return; }
      if(Math.abs(m-med(cur.midis))<=0.9){ cur.midis.push(m); cur.end=fr.t+hopDur; dev=null; }
      else{
        if(!dev) dev={start:fr.t,midis:[m]};
        else if(Math.abs(m-med(dev.midis))<=0.9) dev.midis.push(m);
        else dev={start:fr.t,midis:[m]};
        if(dev.midis.length>=3){ const dn=dev; flush(); cur={start:dn.start,end:fr.t+hopDur,midis:dn.midis}; }
      }
    });
    flush();
    /* 60ms未満の断片は直前のノートへ吸収 */
    const out=[];
    notes.forEach(nt=>{ if(nt.end-nt.start<0.06&&out.length) out[out.length-1].end=nt.end; else out.push(nt); });
    return out;
  }
};

/* ---------- (3) ピッチシフト適用: オフラインで補正バッファを生成 ---------- */
const PitchShift={
  /* レイヤー（または旧形式の notes 配列）から新しい AudioBuffer を導出する。
     元バッファは読み取り専用で、書き換えない（非破壊）。 */
  render(ctx,buffer,layerOrNotes){
    const layer=Array.isArray(layerOrNotes)?{enabled:true,strength:1,notes:layerOrNotes}:layerOrNotes;
    const notes=(layer&&layer.notes)||[];
    const sr=buffer.sampleRate, out=ctx.createBuffer(buffer.numberOfChannels,buffer.length,sr);
    const active=notes.map(n=>({...n,shift:effectiveShift(n,layer)})).filter(n=>Math.abs(n.shift)>1e-4);
    for(let ch=0;ch<buffer.numberOfChannels;ch++){
      const src=buffer.getChannelData(ch), dst=out.getChannelData(ch);
      dst.set(src);
      active.forEach(nt=>{
        const ratio=Math.pow(2,nt.shift/12), pad=0.03;
        const s0=Math.max(0,Math.floor((nt.start-pad)*sr)), s1=Math.min(src.length,Math.ceil((nt.end+pad)*sr));
        if(s1-s0<256) return;
        const shifted=this._shift(src.subarray(s0,s1),ratio,sr/nt.f0);
        const fade=Math.min(Math.floor(pad*sr),Math.floor(shifted.length/2));
        for(let i=0;i<shifted.length;i++){
          let g=1;
          if(i<fade) g=i/fade; else if(i>shifted.length-1-fade) g=(shifted.length-1-i)/fade;
          dst[s0+i]=src[s0+i]*(1-g)+shifted[i]*g;
        }
      });
    }
    return out;
  },
  _shift(x,ratio,period){
    /* 本命は PSOLA（下記）。周期が取れない／短すぎる断片だけ
       リサンプル＋OLA のフォールバックで処理する */
    if(period&&period>=8&&x.length>=4*period){
      /* ratio が 1/整数（特に 0.5）に近いとグレイン配置が恒等写像化して
         音程が変わらない退化が起きるため、大きな下降は sqrt 分解で2段に分ける */
      if(ratio<0.62){ const s=Math.sqrt(ratio);
        return this._psola(this._psola(x,s,period),s,period/s); }
      return this._psola(x,ratio,period);
    }
    const n=Math.max(16,Math.floor(x.length/ratio)), rs=new Float32Array(n);
    for(let i=0;i<n;i++){ const p=i*ratio, i0=Math.floor(p), f=p-i0;
      rs[i]=x[i0]*(1-f)+x[Math.min(i0+1,x.length-1)]*f; }
    return this._stretch(rs,x.length);
  },
  _psola(x,ratio,P){
    /* PSOLA: 周期同期グレイン（長さ約2.5周期）を入力では周期間隔で切り出し、
       出力では P/ratio 間隔で並べる。ratio>1 ではグレインが繰り返され、
       ratio<1 では間引かれるため、長さを保ったまま音程だけが変わる。
       グレイン中心はすべて同じ位相（周期の倍数位置）に揃うので、
       定常な歌声でも音程が元へ引き戻される位相ドリフトが起きない */
    const half=Math.max(8,Math.round(1.25*P)), W=half*2;
    const win=new Float32Array(W);
    for(let i=0;i<W;i++) win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(W-1));
    const out=new Float32Array(x.length+W), wsum=new Float32Array(x.length+W);
    const synHop=P/ratio, nIn=Math.max(1,Math.floor(x.length/P));
    let j=0;
    for(let sp=0; sp<x.length; sp+=synHop, j++){
      const c=Math.round(Math.min(nIn,Math.round(j/ratio))*P); /* 入力グレイン中心 */
      const oC=Math.round(sp);                                  /* 出力グレイン中心 */
      for(let i=0;i<W;i++){
        const si=c-half+i, oi=oC-half+i;
        if(si<0||si>=x.length||oi<0||oi>=out.length) continue;
        out[oi]+=x[si]*win[i]; wsum[oi]+=win[i];
      }
    }
    const y=new Float32Array(x.length);
    for(let i=0;i<x.length;i++) y[i]=wsum[i]>0.25?out[i]/wsum[i]:out[i];
    return y;
  },
  _stretch(x,target){
    /* フォールバック用 OLA タイムストレッチ（周期不明の断片向け） */
    if(x.length===target) return Float32Array.from(x);
    const factor=target/x.length, W=1024, Hs=256, Ha=Hs/factor;
    const out=new Float32Array(target+W), wsum=new Float32Array(target+W);
    const win=new Float32Array(W);
    for(let i=0;i<W;i++) win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(W-1));
    let ap=0, sp=0;
    while(sp<target){
      const a0=Math.min(Math.round(ap),Math.max(0,x.length-W));
      for(let i=0;i<W&&a0+i<x.length;i++){ out[sp+i]+=x[a0+i]*win[i]; wsum[sp+i]+=win[i]; }
      ap+=Ha; sp+=Hs;
    }
    const y=new Float32Array(target);
    for(let i=0;i<target;i++) y[i]=wsum[i]>0.25?out[i]/wsum[i]:out[i];
    return y;
  }
};

/* ---------- 補正の再導出（UIと処理の橋渡し） ---------- */
function refreshPitchRender(cl){
  invalidatePitchCache(cl);
  /* clipBuffer() が必要時に原音＋レイヤーから再導出する。ここでは再生中の追従だけ行う */
  if(S.playing) startSources(currentPos());
  const st=$("#pitchStatus"); if(st) st.textContent=pitchStatusText(cl);
}
function pitchStatusText(cl){
  const L=pitchLayer(cl);
  if(!L) return "未解析です — 原音のみ";
  const c=L.notes.filter(n=>Math.abs(effectiveShift(n,L))>1e-4).length;
  const off=L.notes.filter(n=>n.enabled===false).length;
  return L.notes.length+" ノート検出 / "+c+" ノート補正中"+(off?" / "+off+" ノート無効":"")+(L.enabled?"":"（レイヤーOFF＝原音）")+" ・ 強さ "+Math.round((L.strength==null?1:L.strength)*100)+"%";
}
const PITCH_PRESETS=[

  {id:"full",label:"フル補正 100%",strength:1,desc:"狙った音程まで寄せ切る。スナップと組み合わせる前提"},
];

/* ----- ピッチ補正タブ（UIは pitchLayer だけを見る） ----- */
let pitchSelNote=null;
